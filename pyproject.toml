[project]
name = "nonai"
version = "1.4.3"
description = "AI Fingerprint & Watermark Removal Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "lxml>=5.2.0",
    "pypdf>=4.3.0",
    "pydantic>=2.8.0",
]

[tool.vercel]
entrypoint = "nonai.server:app"
