<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#131b2e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cleanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="1050" cy="150" r="280" fill="#3b82f6" opacity="0.08" filter="url(#ogGlow)" />
  <circle cx="200" cy="500" r="220" fill="#10b981" opacity="0.06" filter="url(#ogGlow)" />

  <!-- Decorative Grid Pattern -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" stroke="#1e293b" stroke-width="1" opacity="0.4" />
  <path d="M 200 0 L 200 630 M 400 0 L 400 630 M 600 0 L 600 630 M 800 0 L 800 630 M 1000 0 L 1000 630" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- Left Side: Branding and Typography -->
  <g transform="translate(100, 140)">
    <!-- Brand Badge -->
    <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#334155" />
    <text x="18" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">100% 離線隱私防護</text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">NonAI</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="155" fill="url(#brandGrad)" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">AI 數位指紋與底層隱藏痕跡消除系統</text>

    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="400">
      <tspan x="0" dy="0">深層逆向剔除隱形 Unicode 零寬字元、清除網頁 CSS 幽靈底色、</tspan>
      <tspan x="0" dy="28">仿生注入 Word RSID 歷史會話與偽裝編輯工時，還原人手真實特徵。</tspan>
    </text>

    <!-- Supported Feature Tags -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#2563eb" stroke-opacity="0.5" />
      <text x="16" y="23" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">DOCX RSID 注入</text>

      <rect x="180" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#059669" stroke-opacity="0.5" />
      <text x="196" y="23" fill="#34d399" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">零寬 Unicode 淨化</text>

      <rect x="360" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#d97706" stroke-opacity="0.5" />
      <text x="376" y="23" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">PDF 元資料偽裝</text>

      <rect x="540" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#9333ea" stroke-opacity="0.5" />
      <text x="556" y="23" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">剪貼簿即時守護</text>
    </g>
  </g>

  <!-- Right Side: Graphic Icon Visual -->
  <g transform="translate(820, 150)">
    <!-- Outer Shield Glow -->
    <path d="M140 30 L240 70 C240 180 195 260 140 300 C85 260 40 180 40 70 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#ogGlow)" opacity="0.9" />

    <path d="M140 45 L226 80 C226 172 188 245 140 280 C92 245 54 172 54 80 Z" 
          fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- Fingerprint Clean vs Glitch -->
    <path d="M120 145 A 25 25 0 0 0 120 185" fill="none" stroke="url(#cleanGlow)" stroke-width="8" stroke-linecap="round" />
    <path d="M106 125 A 45 45 0 0 0 106 205" fill="none" stroke="url(#cleanGlow)" stroke-width="8" stroke-linecap="round" />
    <path d="M92 105 A 68 68 0 0 0 92 225" fill="none" stroke="url(#cleanGlow)" stroke-width="8" stroke-linecap="round" />

    <path d="M140 135 A 30 30 0 0 1 164 165" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8" />
    <path d="M140 110 A 55 55 0 0 1 188 175" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10" />
    <path d="M140 85 A 80 80 0 0 1 212 185" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 12" />

    <!-- Neutralizing Beam -->
    <line x1="190" y1="90" x2="90" y2="240" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="190" y1="90" x2="90" y2="240" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
